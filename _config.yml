# Site identity
minimal_mistakes_skin: "default"

locale: "ko-KR"
title: "Kwon Kwan Woo"
title_separator: "-"
subtitle: "Study Notes"
name: "Kwon Kwan Woo"
description: "AI, NLP, Deep Learning, 그리고 소프트웨어 개발 공부 기록을 담는 GitHub Pages 사이트."
url: "https://kwonkkanu.github.io"
baseurl:
repository: "kwonkkanu/kwonkkanu.github.io"
masthead_title: "Kwon Kwan Woo"
breadcrumbs: true
words_per_minute: 200

# Search
search: true
search_full_content: true
search_provider: "lunr"
lunr:
  search_within_pages: true

comments:
  provider:

social:
  type: "Person"
  name: "Kwon Kwan Woo"
  links:
    - "https://kwonkkanu.github.io"
    - "https://github.com/kwonkkanu"

# Author / profile
author:
  name: "Kwon Kwan Woo"
  avatar:
  bio: "AI, NLP, Deep Learning, 그리고 소프트웨어 개발을 공부하고 기록합니다."
  location: "Daejeon, South Korea"
  email:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://kwonkkanu.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kwonkkanu"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kwonkkanu"
  since: "2025"

# Files to include or exclude from the built site
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - VAULT_MAP.md
  - .github/.github_README.md
  - assets/assets_README.md
  - assets/css/css_README.md
  - assets/js/js_README.md
  - assets/pdfs/pdfs_README.md
  - docs/docs_README.md
  - test/test_README.md
  - _data/_data_README.md
  - _includes/_includes_README.md
  - _layouts/_layouts_README.md
  - _notes/_notes_README.md
  - _notes/코테준비/코테준비_README.md
  - _pages/_pages_README.md
  - _sass/_sass_README.md
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown / rendering
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Stylesheet pipeline
sass:
  sass_dir: _sass
  style: compressed

# URL and collection structure
permalink: /:categories/:title/
timezone: "Asia/Seoul"

# Main content collections
collections:
  notes:
    output: true
    permalink: /notes/:path/

paginate: 5
paginate_path: /page:num/

# GitHub Pages-compatible plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

# Default front matter by content type
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false

  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: false
      read_time: false
      show_date: true
      comments: false
      share: false
      related: false
